[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vslam"
version = "0.1.0"
description = "From-scratch visual SLAM toolkit accompanying the vSLAM course"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
dev = ["pytest>=7"]
notebooks = ["jupyter", "nbconvert"]

[tool.setuptools.packages.find]
include = ["vslam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
